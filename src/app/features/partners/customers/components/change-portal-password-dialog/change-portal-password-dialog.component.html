<p-dialog
  [header]="'partners.customers.portal.changePasswordTitle' | translate"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <div class="flex flex-col gap-4 py-2">
    <p class="text-sm text-surface-600 dark:text-surface-400">
      {{ 'partners.customers.portal.changePasswordDescription' | translate }}
      <strong>{{ customerName() }}</strong
      >.
    </p>
    <div class="flex flex-col gap-1">
      <label for="customer-new-password" class="text-sm font-medium">
        {{ 'partners.customers.portal.newPassword' | translate }}
      </label>
      <input
        id="customer-new-password"
        pInputText
        type="password"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        (blur)="passwordTouched.set(true)"
        autocomplete="new-password"
        class="w-full"
        [class.ng-invalid]="passwordTouched() && passwordError()"
        [class.ng-dirty]="passwordTouched()"
      />
      @if (passwordTouched() && passwordError()) {
        <small class="text-xs text-red-500">{{ passwordError() | translate }}</small>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label for="customer-confirm-password" class="text-sm font-medium">
        {{ 'partners.customers.portal.confirmPassword' | translate }}
      </label>
      <input
        id="customer-confirm-password"
        pInputText
        type="password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        (blur)="confirmPasswordTouched.set(true)"
        autocomplete="new-password"
        class="w-full"
        [class.ng-invalid]="confirmPasswordTouched() && confirmPasswordError()"
        [class.ng-dirty]="confirmPasswordTouched()"
      />
      @if (confirmPasswordTouched() && confirmPasswordError()) {
        <small class="text-xs text-red-500">{{ confirmPasswordError() | translate }}</small>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'shared.cancel' | translate"
        [outlined]="true"
        severity="secondary"
        (onClick)="close()"
      />
      <p-button
        [label]="'shared.save' | translate"
        severity="contrast"
        [loading]="loading()"
        [disabled]="!isValid()"
        (onClick)="onSubmit()"
      />
    </div>
  </ng-template>
</p-dialog>
